<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZINO PLAY+</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: Georgia, serif;
    text-align: center;
  }
  header {
    padding: 20px;
    border-bottom: 1px solid #d4af37;
  }
  .logo {
    color: #d4af37;
    font-size: 28px;
    letter-spacing: 4px;
    font-weight: bold;
  }
  .hero {
    padding: 80px 20px;
    background: linear-gradient(#000, #1a1405);
  }
  .hero h1 {
    color: #d4af37;
    font-size: 34px;
    margin-bottom: 16px;
  }
  .hero p {
    color: #cccccc;
    font-size: 17px;
    margin-bottom: 30px;
  }
  .btn {
    display: inline-block;
    background: #d4af37;
    color: #000;
    padding: 14px 28px;
    border-radius: 6px;
    font-weight: bold;
    text-decoration: none;
  }
  footer {
    padding: 20px;
    color: #888;
    font-size: 13px;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">ZINO PLAY+</div>
  </header>
  <section class="hero">
    <h1>Independent Cinema, Streaming Now</h1>
    <p>Watch films from independent filmmakers and production companies.</p>
    <a class="btn" href="#">Start Watching</a>
  </section>
  <footer>© ZINO PLAY+</footer>
</body>
</html>
